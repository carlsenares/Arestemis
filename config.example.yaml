# Copy to config.yaml and fill in your real values. config.yaml is git-ignored.

search:
  # Rent is treated as WARM (total incl. utilities). If you meant cold, change the
  # interpretation in filter.py. A single flat qualifies if it meets ANY tier:
  #   sqm >= tier.min_sqm  AND  rent_warm <= tier.max_rent_warm
  # Bigger flats get a higher budget. Evaluate tiers from largest min_sqm down.
  min_sqm: 28                # hard floor; anything smaller is rejected outright
  rent_tiers:
    - { min_sqm: 28, max_rent_warm: 1000 }   # 28-39 m²  -> up to 1000 EUR
    - { min_sqm: 40, max_rent_warm: 1200 }   # 40 m²+    -> up to 1200 EUR
  min_rooms: 1
  # Move-in window (YYYY-MM-DD). earliest_move_in is required; latest_move_in is
  # optional and closes the window — without it, a listing free from any later
  # date still matches, which is rarely what a target move-in date means.
  earliest_move_in: "2026-08-01"
  latest_move_in: "2026-08-31"
  # Area: the Garching <-> Munich corridor (TUM campus is in Garching). Broad on
  # purpose along the U6 axis; refine later. Adapters map these names to portal areas.
  areas:
    - Garching bei München
    - Garching-Hochbrück
    - Freimann
    - Studentenstadt
    - Schwabing
    - Maxvorstadt
    - München
  # Vetoes a listing even when `areas` matched — use it to keep `areas` broad
  # enough to scope the portal queries while carving the outskirts back out.
  # Matched whole-word over city/district/PLZ/title, so "Dachauer Straße" is not
  # read as Dachau. Accepts district names, town names and postal codes.
  exclude_areas: []
  # Postal codes optional, used by sources that filter by PLZ:
  postal_codes: []

wg_rule:
  # Single apartments always qualify. `mode` decides what happens to WG rooms:
  #   none          -> WG rooms never match.
  #   empty_2person -> only an EMPTY 2-person WG (you take the whole flat and
  #                    choose the flatmate). The LLM classifies this from the
  #                    listing description.
  #   any           -> an ordinary room in a shared flat is a valid hit too.
  mode: empty_2person

sources:
  wg_gesucht: true
  kleinanzeigen: true
  immowelt: true             # München only, card-only (detail pages are captcha-walled)
  immoscout: true            # mobile-app API (München+Garching); website is captcha-walled

poll_interval_seconds: 60

about_me: |
  # A short blurb about you (kept for reference / future use). Write it however
  # you like. Example:
  # I'm Carl, 22, studying Informatics at TUM. Non-smoker, tidy, quiet, reliable
  # with rent (Bafög + part-time job + parental support). Looking for a long-term
  # home. Friendly and easy to live with.

# Application template for the ✍️ Generate button. Assembled verbatim in German
# (no LLM, so it reads exactly as you write it): intro, then garching_line ONLY
# for listings in Garching, then outro.
application:
  intro: "Hallo, mein Name ist <Name> und ich studiere aktuell <Fach> an der TUM."
  garching_line: "Deshalb ist die Lage perfekt für mich, da ich schnell und einfach zur Uni komme."
  outro: "Ich lebe ordentlich und sauber, bin Nichtraucher und die Zahlung ist gesichert. Über eine Besichtigung würde ich mich sehr freuen."
